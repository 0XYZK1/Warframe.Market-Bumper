
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #09090b; --card-bg: #121214; --text: #fafafa;
            --text-muted: #a1a1aa; --border: #27272a; --accent: #ffffff;
            --error: #ef4444; --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        .card { width: 100%; max-width: 420px; padding: 32px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 24px; text-align: center; letter-spacing: 1.5px; text-transform: uppercase; }
        .input-group { margin-bottom: 24px; }
        label { display: block; font-size: 0.75rem; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        input[type="password"] { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 0.95rem; transition: all 0.2s; }
        input[type="password"]:focus { outline: none; border-color: var(--text-muted); background: rgba(255,255,255,0.02); }
        button { width: 100%; padding: 12px; background: var(--accent); color: var(--bg); border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        button:hover:not(:disabled) { opacity: 0.8; }
        button:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
        .status-box { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 0.85rem; text-align: center; min-height: 44px; line-height: 1.4; display: flex; align-items: center; justify-content: center; white-space: pre-wrap; background: rgba(255,255,255,0.03); border: 1px solid transparent; }
        .status-box.error { color: var(--error); border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); }
        .status-box.success { color: var(--success); border-color: rgba(34, 197, 94, 0.3); background: rgba(34, 197, 94, 0.1); }
        .status-box.loading { color: var(--text); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Market Updater</h1>
        <div class="input-group">
            <label for="token">JWT Token</label>
            <input type="password" id="token" placeholder="Token einfügen..." autocomplete="off">
        </div>
        <button id="updateBtn" onclick="startUpdate()">Update My Articles</button>
        <div id="statusBox" class="status-box">Bereit.</div>
    </div>

    <script type="text/javascript" src="/eel.js"></script>
    <script>
        let isUpdating = false;
        let pollInterval = null;

        async function startUpdate() {
            if (isUpdating) return;

            const tokenInput = document.getElementById('token');
            const btn = document.getElementById('updateBtn');
            const statusBox = document.getElementById('statusBox');
            const token = tokenInput.value.trim();

            if (!token) {
                statusBox.textContent = 'Bitte Token eingeben.';
                statusBox.className = 'status-box error';
                return;
            }

            isUpdating = true;
            btn.disabled = true;
            btn.textContent = 'Updating...';
            statusBox.textContent = 'Starte Update-Prozess...';
            statusBox.className = 'status-box loading';

            pollInterval = setInterval(async () => {
                try {
                    const status = await eel.get_status()();
                    statusBox.textContent = status.message;
                    statusBox.className = 'status-box ' + status.type;

                    if (status.done) {
                        clearInterval(pollInterval);
                        isUpdating = false;
                        btn.disabled = false;
                        btn.textContent = 'Update My Articles';
                    }
                } catch (e) {
                    console.error("Polling Fehler:", e);
                }
            }, 300); 

            try {
                await eel.start_update_process(token)();
            } catch (e) {
                statusBox.textContent = 'Kritischer Fehler im Interface.';
                statusBox.className = 'status-box error';
                clearInterval(pollInterval);
                isUpdating = false;
                btn.disabled = false;
                btn.textContent = 'Update My Articles';
            }
        }
    </script>
</body>
</html>
